name: Tanex Word sablonlarini indir ve dogrula
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tanex-etiket-studyosu/scripts/sync_tanex.py
      - .github/workflows/tanex-sync.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install -r tanex-etiket-studyosu/requirements.txt requests beautifulsoup4
      - name: Official template downloads and validation
        run: python tanex-etiket-studyosu/scripts/sync_tanex.py
      - name: Commit downloaded templates to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tanex-etiket-studyosu/templates/
          if ! git diff --staged --quiet; then
            git commit -m "Import official Tanex DOCX templates and catalog"
            git push origin HEAD:main
          fi
